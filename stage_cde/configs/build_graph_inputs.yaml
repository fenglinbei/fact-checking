data:
  raw_train_path: ../data/raw/LIAR-RAW/train.json
  raw_val_path: ../data/raw/LIAR-RAW/val.json
  raw_test_path: ../data/raw/LIAR-RAW/test.json

  stage_b_train_predictions: ../stage_ab/outputs/liar-raw/stage_b/stage_b_predictions_train.jsonl
  stage_b_val_predictions: ../stage_ab/outputs/liar-raw/stage_b/stage_b_predictions_val.jsonl
  stage_b_test_predictions: ../stage_ab/outputs/liar-raw/stage_b/stage_b_predictions_test.jsonl

output:
  dir: outputs/graph_inputs

decomposition:
  method: hf_local     # heuristic | hf_local
  hf_model_name: /data/liaozijie/models/Llama-3-8B-Instruct   # 例如 Qwen/Qwen2.5-3B-Instruct
  use_vllm: true
  vllm_tensor_parallel_size: 4
  vllm_gpu_memory_utilization: 0.9
  max_new_tokens: 192
  max_subclaims: 4
  min_claim_tokens_to_split: 14
  min_subclaim_tokens: 4

assignment:
  embedder_model: /data/liaozijie/models/bge-base-en-v1.5
  top_k_support_per_subclaim: 2
  top_k_refute_per_subclaim: 2

graph:
  add_same_report_edges: true
  add_lexical_overlap_edges: true
  lexical_overlap_jaccard_threshold: 0.18
