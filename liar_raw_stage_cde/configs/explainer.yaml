data:
  raw_train_path: data/raw/train.json
  raw_val_path: data/raw/val.json
  raw_test_path: data/raw/test.json

  train_graph_inputs: outputs/graph_inputs/train.graph.jsonl
  val_graph_inputs: outputs/graph_inputs/val.graph.jsonl
  test_graph_inputs: outputs/graph_inputs/test.graph.jsonl

  train_graph_predictions: outputs/graph_verifier/train.graph_predictions.jsonl
  val_graph_predictions: outputs/graph_verifier/val.graph_predictions.jsonl
  test_graph_predictions: outputs/graph_verifier/test.graph_predictions.jsonl

model:
  mode: template           # template | seq2seq
  model_name: google/flan-t5-base
  max_input_length: 1024
  max_output_length: 128

train:
  batch_size: 4
  num_epochs: 4
  lr: 3.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  seed: 13
  num_workers: 0

faithfulness:
  enable: true
  embedder_model: sentence-transformers/all-MiniLM-L6-v2
  semantic_threshold: 0.50
  lexical_jaccard_threshold: 0.12

output:
  dir: outputs/explanations
