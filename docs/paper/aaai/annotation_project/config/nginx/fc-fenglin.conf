proxy_cache_path /var/cache/nginx/label-studio-static
    levels=1:2
    keys_zone=ls_static:10m
    max_size=512m
    inactive=30d
    use_temp_path=off;

map $http_upgrade $fc_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name fc.fenglin.pro;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Label Studio versioned frontend assets. These paths are public static
    # content; login, API, task, and annotation responses remain uncached.
    location ^~ /static/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";

        proxy_cache ls_static;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$host$request_uri";
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 60s;
        proxy_cache_lock_age 60s;
        proxy_cache_revalidate on;
        proxy_cache_background_update on;
        proxy_cache_use_stale
            error
            timeout
            invalid_header
            updating
            http_500
            http_502
            http_503
            http_504;

        # Label Studio emits session headers even for invariant assets.
        proxy_ignore_headers Set-Cookie Vary;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Vary;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /react-app/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";

        proxy_cache ls_static;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$host$request_uri";
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 60s;
        proxy_cache_lock_age 60s;
        proxy_cache_revalidate on;
        proxy_cache_background_update on;
        proxy_cache_use_stale
            error
            timeout
            invalid_header
            updating
            http_500
            http_502
            http_503
            http_504;

        proxy_ignore_headers Set-Cookie Vary;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Vary;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Dynamic Label Studio routes remain uncached.
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fc_connection_upgrade;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
    }

    # Case study (existing route).
    location /evidence-map/ {
        proxy_pass http://127.0.0.1:18765;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/fc.fenglin.pro/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/fc.fenglin.pro/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = fc.fenglin.pro) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name fc.fenglin.pro;
    return 404; # managed by Certbot
}
