<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">MREC v0.2 Learned Marginal Proxy Top-5 Method Diagram</title>
  <desc id="desc">A method diagram emphasizing stages 3, 4, and 5, with stage 2 as secondary focus.</desc>
  <defs>
    <style>
      .bg { fill: #fbfcfe; }
      .title { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 34px; font-weight: 700; fill: #16202a; }
      .subtitle { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 18px; fill: #536171; }
      .stage-title { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 22px; font-weight: 700; fill: #17202a; }
      .stage-tag { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 13px; font-weight: 700; letter-spacing: .5px; }
      .text { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 17px; fill: #26323f; }
      .small { font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 14px; fill: #405060; }
      .formula { font-family: "DejaVu Sans", Arial, "Noto Sans CJK SC", sans-serif; font-size: 17px; fill: #17202a; }
      .muted { fill: #64748b; }
      .box { rx: 14; ry: 14; }
      .outer { fill: #ffffff; stroke-width: 2.4; rx: 22; ry: 22; }
      .node { fill: #ffffff; stroke-width: 1.6; rx: 12; ry: 12; }
      .stage2 { stroke: #2f8f6f; }
      .stage3 { stroke: #d96c1c; }
      .stage4 { stroke: #4d6fd9; }
      .stage5 { stroke: #7a4fd6; }
      .neutral { stroke: #8a96a3; }
      .stage2-fill { fill: #eaf7f2; }
      .stage3-fill { fill: #fff0e4; }
      .stage4-fill { fill: #edf2ff; }
      .stage5-fill { fill: #f3edff; }
      .neutral-fill { fill: #f6f8fb; }
      .arrow { fill: none; stroke: #4b5563; stroke-width: 2.4; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #788494; stroke-width: 2; marker-end: url(#arrow-soft); stroke-dasharray: 7 7; }
      .loop { fill: none; stroke: #7a4fd6; stroke-width: 2.2; marker-end: url(#arrow-purple); }
      .emph3 { fill: #d96c1c; }
      .emph4 { fill: #4d6fd9; }
      .emph5 { fill: #7a4fd6; }
      .emph2 { fill: #2f8f6f; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#4b5563"/>
    </marker>
    <marker id="arrow-soft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#788494"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7a4fd6"/>
    </marker>
  </defs>

  <rect class="bg" width="1800" height="1120"/>

  <text x="70" y="70" class="title">MREC v0.2 Learned Marginal Proxy Top-5</text>
  <text x="70" y="102" class="subtitle">Atom-evidence map → learned marginal utility → proxy pairwise learning → greedy minimal-resolving evidence chain → top-5 verifier prompt</text>

  <!-- Input -->
  <rect x="70" y="195" width="210" height="150" class="outer neutral neutral-fill"/>
  <text x="92" y="227" class="stage-tag muted">INPUT</text>
  <text x="92" y="263" class="stage-title">Claim + Reports</text>
  <text x="92" y="300" class="formula">c, R</text>
  <text x="92" y="328" class="small">claim text and source reports</text>

  <!-- Stage 2 -->
  <rect x="350" y="160" width="350" height="585" class="outer stage2 stage2-fill"/>
  <text x="380" y="198" class="stage-tag emph2">STAGE 2 · SECONDARY FOCUS</text>
  <text x="380" y="236" class="stage-title">Atomic Evidence Map</text>
  <text x="380" y="267" class="small">Build semantic anchors for later chain selection.</text>

  <rect x="385" y="305" width="280" height="78" class="node stage2"/>
  <text x="410" y="334" class="text">Claim atoms</text>
  <text x="410" y="363" class="formula">A = {a₁, ..., aₘ}</text>

  <rect x="385" y="412" width="280" height="78" class="node stage2"/>
  <text x="410" y="441" class="text">Candidate pool</text>
  <text x="410" y="470" class="formula">C = {e₁, ..., eₙ}</text>

  <rect x="385" y="520" width="280" height="95" class="node stage2"/>
  <text x="410" y="549" class="text">Atom-evidence map</text>
  <text x="410" y="579" class="formula">M(eⱼ,aᵢ) = (rᵢⱼ,dᵢⱼ,qᵢⱼ)</text>
  <text x="410" y="603" class="small">relation · directness · quality</text>

  <rect x="385" y="645" width="280" height="72" class="node stage2"/>
  <text x="410" y="674" class="text">Atom state tracker</text>
  <text x="410" y="702" class="formula">hₜ(aᵢ) ∈ {U,S,R,Q,C}</text>

  <!-- Stage 4 -->
  <rect x="770" y="160" width="455" height="510" class="outer stage4 stage4-fill"/>
  <text x="800" y="198" class="stage-tag emph4">STAGE 4 · PRIMARY FOCUS</text>
  <text x="800" y="236" class="stage-title">Proxy Pairwise Learning</text>
  <text x="800" y="267" class="small">Learn local evidence preferences before verifier training.</text>

  <rect x="805" y="302" width="385" height="68" class="node stage4"/>
  <text x="828" y="331" class="text">Short proxy rollout under selected prefix</text>
  <text x="828" y="357" class="formula">Z&lt;t, hₜ₋₁</text>

  <rect x="805" y="395" width="385" height="68" class="node stage4"/>
  <text x="828" y="424" class="text">Pairwise preferences</text>
  <text x="828" y="450" class="formula">Dpair = {(e⁺, e⁻, Z&lt;t, hₜ₋₁)}</text>

  <rect x="805" y="500" width="385" height="148" class="node stage4"/>
  <text x="828" y="529" class="text">Logistic pairwise loss</text>
  <text x="828" y="560" class="formula">Lproxy = 1/N Σ log(1 + exp(</text>
  <text x="828" y="586" class="formula">  -(u(e⁺)-u(e⁻))))</text>
  <text x="828" y="619" class="text">Output learned weights</text>
  <text x="828" y="644" class="formula">θ, β</text>

  <!-- Stage 3 -->
  <rect x="770" y="700" width="455" height="340" class="outer stage3 stage3-fill"/>
  <text x="800" y="738" class="stage-tag emph3">STAGE 3 · PRIMARY FOCUS</text>
  <text x="800" y="776" class="stage-title">Learned Marginal Utility</text>
  <text x="800" y="807" class="small">Score additional value relative to the current prefix.</text>

  <rect x="805" y="842" width="385" height="72" class="node stage3"/>
  <text x="828" y="871" class="text">Prefix-conditioned features</text>
  <text x="828" y="899" class="formula">φₜ(e) = φ(e | Z&lt;t, hₜ₋₁, M)</text>

  <rect x="805" y="940" width="385" height="90" class="node stage3"/>
  <text x="828" y="969" class="text">Marginal utility</text>
  <text x="828" y="995" class="formula">uθ(e|Z&lt;t) = b + Σ θℓφₜ,ℓ(e)</text>
  <text x="828" y="1020" class="formula">  - β cost(e)</text>

  <!-- Stage 5 -->
  <rect x="1300" y="185" width="430" height="625" class="outer stage5 stage5-fill"/>
  <text x="1330" y="223" class="stage-tag emph5">STAGE 5 · PRIMARY FOCUS</text>
  <text x="1330" y="261" class="stage-title">Greedy MREC Selection</text>
  <text x="1330" y="292" class="small">Construct a bounded minimal-resolving evidence chain.</text>

  <rect x="1335" y="330" width="360" height="64" class="node stage5"/>
  <text x="1358" y="358" class="text">Remaining candidates</text>
  <text x="1358" y="384" class="formula">Cₜ = C \ Z&lt;t</text>

  <rect x="1335" y="420" width="360" height="74" class="node stage5"/>
  <text x="1358" y="449" class="text">Select next evidence</text>
  <text x="1358" y="477" class="formula">eₜ = argmaxₑ uθ(e | Z&lt;t)</text>

  <rect x="1335" y="520" width="360" height="74" class="node stage5"/>
  <text x="1358" y="549" class="text">Update atom state</text>
  <text x="1358" y="577" class="formula">hₜ = Update(hₜ₋₁, eₜ, M)</text>

  <rect x="1335" y="620" width="360" height="84" class="node stage5"/>
  <text x="1358" y="649" class="text">Stop / continue</text>
  <text x="1358" y="677" class="formula">kmin ≤ |Z| ≤ kmax</text>
  <text x="1358" y="698" class="small">stop after kmin if max utility ≤ τ</text>

  <rect x="1335" y="730" width="360" height="55" class="node stage5"/>
  <text x="1358" y="764" class="text">Ordered chain Z = (z₁, ..., zT)</text>

  <!-- Output -->
  <rect x="1300" y="875" width="430" height="148" class="outer neutral neutral-fill"/>
  <text x="1330" y="913" class="stage-tag muted">TOP-5 REALIZATION</text>
  <text x="1330" y="949" class="stage-title">Verifier-visible Prompt</text>
  <text x="1330" y="982" class="formula">Z₁:₅ → "Check: cue" + evidence text</text>
  <text x="1330" y="1010" class="formula">ŷ = argmax pψ(y | π(c,Z₁:₅))</text>

  <!-- Connectors -->
  <path d="M280 270 C315 270 320 270 350 270" class="arrow"/>
  <path d="M665 568 C720 568 725 842 805 872" class="arrow"/>
  <path d="M665 685 C715 705 745 850 805 878" class="arrow-soft"/>
  <path d="M997 648 C997 672 997 672 997 700" class="arrow-soft"/>
  <path d="M1190 975 C1245 915 1260 486 1335 457" class="arrow"/>
  <path d="M1695 662 C1748 662 1748 362 1695 362" class="loop"/>
  <path d="M1515 785 C1515 830 1515 838 1515 875" class="arrow"/>

  <!-- Explanatory badges -->
  <rect x="70" y="845" width="610" height="178" rx="18" ry="18" fill="#ffffff" stroke="#d3d9e3" stroke-width="1.6"/>
  <text x="100" y="884" class="stage-title">Reading Emphasis</text>
  <circle cx="112" cy="921" r="7" fill="#2f8f6f"/>
  <text x="132" y="927" class="text">Stage 2 supplies atom states and map signals.</text>
  <circle cx="112" cy="956" r="7" fill="#d96c1c"/>
  <text x="132" y="962" class="text">Stage 3 turns map/prefix signals into marginal utility.</text>
  <circle cx="112" cy="991" r="7" fill="#4d6fd9"/>
  <text x="132" y="997" class="text">Stage 4 learns utility weights from proxy pairwise preferences.</text>
  <circle cx="112" cy="1026" r="7" fill="#7a4fd6"/>
  <text x="132" y="1032" class="text">Stage 5 greedily builds a minimal resolving chain, then keeps top 5.</text>
</svg>
