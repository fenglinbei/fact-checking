# @package _global_
build:
  output_policy: fingerprint_cache
  data:
    train_path: data/raw/LIAR-RAW/train.json
    val_path: data/raw/LIAR-RAW/val.json
    test_path: data/raw/LIAR-RAW/test.json
  retrieval:
    embedder_model: /data/models/bge-base-en-v1.5/
    device: cuda
    max_length: 256
    batch_size: 64
    top_k: 32
    alpha_dense: 0.70
    alpha_lexical: 0.20
    alpha_bm25: 0.10
    mmr_lambda: 0.70
    selection_method: mmr          # mmr | reranker | raw_top_evidence
    reranker:
      model_name: /data/models/Qwen3-Reranker-0.6B/
      device: cuda
      max_length: 4096
      batch_size: 4
      normalize: true
    # Performance optimizations
    precision: bf16              # fp32 | fp16 | bf16
    num_gpus: 4                  # 1 = serial, >1 = multi-GPU via multiprocessing
    prefetch_size: 200             # samples per embedding batch (1 = per-sample)
    cpu_workers: 4               # thread workers for CPU post-embedding work
    chunking:
      strategy: sentence           # sentence | raw | ctx_window | semantic | ctx_semantic | abc_claim_aware
      context_k: 1                 # ctx_window / ctx_semantic 窗口大小
      theta: 0.7                   # semantic / ctx_semantic 相似度阈值
      embedder_model: null         # null = 复用 retrieval.embedder_model
      device: cpu                  # semantic chunking 推荐使用 CPU
      max_length: 256
      batch_size: 64
      precision: fp32
  prompt:
    model_name_or_path: /data/models/Qwen2.5-7B-Instruct
    auto_length: true
    max_length: 2048
    output_mode: label_only          # label_only | explanation_label
    system_prompt: null              # null = use default system prompt
