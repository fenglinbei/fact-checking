# @package _global_
infer:
  config_path: null
  provider: vllm_openai
  split: test
  checkpoint: best
  served_model_name: fact-checking-sft
  host: 127.0.0.1
  port: 8000
  base_url: null
  wait_seconds: 180
  request_timeout_seconds: 120
  log_predictions: 5
  cuda_visible_devices: "0"
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.90
  dtype: auto
  max_model_len: null
  max_new_tokens: null
  temperature: null
  top_p: 1.0
  presence_penalty: 0.0
  frequency_penalty: 0.0
  repetition_penalty: 1.0
  label_decoding:
    enabled: true
    mode: prompt_logprobs
    prefix: "Label:"
    guided_choice: true
    max_tokens: 1
    scoring_max_tokens: 1
    prompt_logprobs: 0
  merge_lora_cache:
    enabled: true
    dir: outputs/cache/merged_lora
    force_rebuild: false
  server:
    manage: true
    stop_after_infer: true
    pid_file: null
    extra_args: []
