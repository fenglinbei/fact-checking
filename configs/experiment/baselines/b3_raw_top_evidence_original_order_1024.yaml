# @package _global_
# Full-pipeline verifier experiment using LIAR-RAW tokenized sentence labels.
# Select top-5 only from sentences where reports[].tokenized[].is_evidence=1,
# preserving original report/sentence order.

defaults:
  - b3_label_token_ce_1024
  - _self_

experiment:
  name: b3_raw_top_evidence_original_order_1024

baseline:
  variant: b3_raw_top_evidence_original_order_1024
  chunking_strategy: raw_tokenized_sentence_original_order

build:
  data:
    sentence_source: tokenized
    sentence_min_char_len: 1
  retrieval:
    top_k: 5
    selection_method: raw_top_evidence
    raw_top_evidence:
      method: original_order
      positive_only: true
      pad_to_top_k: false
    chunking:
      strategy: sentence
      context_k: 1
      theta: 0.7
      embedder_model: null
      device: cpu
      max_length: 256
      batch_size: 64
      precision: fp32

swanlab:
  project: fact-checking-raw-top-evidence
  experiment_name: b3_raw_top_evidence_original_order_1024
