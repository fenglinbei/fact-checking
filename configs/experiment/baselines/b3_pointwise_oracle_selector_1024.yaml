# @package _global_
# b3 semantic chunking + oracle-supervised pointwise evidence selector.

defaults:
  - b3_mmr_topk_sweep_1024
  - _self_

experiment:
  name: b3_pointwise_oracle_selector_1024

baseline:
  variant: b3_pointwise_oracle_selector_1024
  chunking_strategy: semantic

build:
  retrieval:
    top_k: 5
    selection_method: pointwise_oracle
    pointwise_oracle:
      model_dir: outputs/oracle_pointwise/v1/logreg
      candidate_pool_size: null
      candidate_pool_multiplier: 3
      dump_trace: true

swanlab:
  project: fact-checking-b3-pointwise-oracle-1024
  experiment_name: b3_pointwise_oracle_selector_1024
