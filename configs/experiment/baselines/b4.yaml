# @package _global_
defaults:
  - b0
  - _self_

experiment:
  name: b4

baseline:
  variant: b4

# 覆盖 b0 中 /data/models/* 的路径 (本机不存在), 改用本机实际位置.
# - BGE 英文版: /home/fenglin/project/models/bge-base-en-v1.5 (与 LIAR-RAW 英文数据集匹配;
#   /home/fenglin/project/hateSpeechDetection/models/base/ 下只有 bge-large-zh-v1.5 中文版, 不适用).
# - Qwen2.5-7B-Instruct 仅用于 build 阶段 prompt token 计数; 不参与 b4 训练/推理.
build:
  retrieval:
    embedder_model: /home/fenglin/project/models/bge-base-en-v1.5
    device: cuda
    max_length: 256
    batch_size: 512
    top_k: 16
    alpha_dense: 0.70
    alpha_lexical: 0.20
    alpha_bm25: 0.10
    mmr_lambda: 0.70
    precision: bf16
    num_gpus: 1
    prefetch_size: 512
    cpu_workers: 4
    chunking:
      strategy: sentence
      context_k: 1
  prompt:
    model_name_or_path: /home/fenglin/project/hateSpeechDetection/models/base/Qwen2.5-7B-Instruct

train:
  kind: classifier
  model_name_or_path: answerdotai/ModernBERT-large  # 从 HF 下载/缓存; 本机无离线副本
  backend: single
  cuda_visible_devices: "0"
  nproc_per_node: 1
  num_machines: 1
  deepspeed_config: null
  checkpoint_for_infer: best

sft_train:
  top_k_evidence: 16
  max_length: 2048
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  num_train_epochs: 6
  loss:
    kind: coral
  weight_decay: 0.01
  warmup_ratio: 0.06
  bf16: true
  logging_steps: 10
  save_steps: 300
  eval_steps: 300
  dataloader_num_workers: 2
  gradient_checkpointing: true
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  seed: 42

infer:
  kind: classifier
  split: test
  checkpoint: best
  batch_size: 8
  cuda_visible_devices: "0"
  dtype: bfloat16

swanlab:
  experiment_name: b4
