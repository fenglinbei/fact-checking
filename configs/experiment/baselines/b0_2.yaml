# @package _global_
defaults:
  - b0
  - _self_

experiment:
  name: b0_2

infer:
  max_new_tokens: 128

baseline:
  variant: b0_2
  top_k: 10
  output_mode: explanation_label

build:
  prompt:
    output_mode: explanation_label

sft_train:
  max_new_tokens: 128
  num_train_epochs: 4
  max_length: 1280
  lora:
    enabled: true
    r: 16
    alpha: 32
    dropout: 0.05
    bias: none
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    modules_to_save: null
