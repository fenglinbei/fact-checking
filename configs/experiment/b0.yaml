# @package _global_
experiment:
  name: b0

baseline:
  # baseline 仅作实验描述记录，不影响运行配置
  # 实际运行参数以 build / sft_train / train / infer 为准
  variant: b0

build:
  data:
    train_path: data/raw/LIAR-RAW/train.json
    val_path: data/raw/LIAR-RAW/val.json
    test_path: data/raw/LIAR-RAW/test.json
  retrieval:
    embedder_model: /data/models/bge-base-en-v1.5/
    device: cuda
    max_length: 256
    batch_size: 64
    top_k: 16
    alpha_dense: 0.70
    alpha_lexical: 0.20
    alpha_bm25: 0.10
    mmr_lambda: 0.70
    precision: bf16
    num_gpus: 4
    prefetch_size: 200
    cpu_workers: 4
    chunking:
      strategy: sentence
      context_k: 1
  prompt:
    model_name_or_path: /data/models/Qwen2.5-7B-Instruct
    auto_length: true
    max_length: 2048
    output_mode: label_only
    label_format: letter  # letter | name. letter = 单 token A-F,消除多 token 标签的隐式偏差

sft_train:
  max_new_tokens: 8
  temperature: 0.0
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-5
  num_train_epochs: 2
  weight_decay: 0.0
  warmup_ratio: 0.03
  bf16: true
  max_length: 2048
  logging_steps: 2
  save_steps: 100
  eval_steps: 100
  dataloader_num_workers: 4
  gradient_checkpointing: true
  use_flash_attention_2: true
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  padding: longest
  use_length_bucket: true
  empty_cache_steps: 1
  empty_cache_on_eval: true
  empty_cache_on_save: true
  logit_adjust:
    enabled: true   # 推理端类先验校正:adjusted = logit - tau * log(prior)
    tau: 1.0        # τ=1.0 = 完整 prior 校正 (Menon 2021 默认);0 = 纯模型 logit

train:
  model_name_or_path: /data/models/Qwen2.5-7B-Instruct
  backend: accelerate_deepspeed
  cuda_visible_devices: "0,1,2,3"
  nproc_per_node: 4
  deepspeed_config: configs/deepspeed_zero2.json
  checkpoint_for_infer: best

infer:
  provider: vllm_openai
  split: test
  checkpoint: best
  served_model_name: fact-checking-sft
  host: 127.0.0.1
  port: 35001
  wait_seconds: 180/
  request_timeout_seconds: 120
  max_new_tokens: 8
  temperature: 0.0
  cuda_visible_devices: "0,1,2,3"
  tensor_parallel_size: 4
  gpu_memory_utilization: 0.90
  dtype: auto
  server:
    manage: true
    stop_after_infer: true

tracking:
  enabled: true
  backend: swanlab

swanlab:
  project: fact-checking-build-train-infer
  experiment_name: b0
