# @package _global_
# Full fine-tuning variant of the selector-trace verifier.
# This disables LoRA/PEFT and saves full HF checkpoints for inference.

defaults:
  - b3_oracle_sentence_direct_verifier_1024
  - _self_

experiment:
  name: b3_oracle_sentence_direct_verifier_1024_fullft

baseline:
  variant: b3_oracle_sentence_direct_verifier_1024_fullft

train:
  deepspeed_config: configs/deepspeed_zero3_bsz2_ga4.json

sft_train:
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-6
  early_stopping_patience: 6
  lora:
    enabled: false

infer:
  merge_lora_cache:
    enabled: false

swanlab:
  project: fact-checking-oracle-direct-verifier-fullft
  experiment_name: b3_oracle_sentence_direct_verifier_1024_fullft
