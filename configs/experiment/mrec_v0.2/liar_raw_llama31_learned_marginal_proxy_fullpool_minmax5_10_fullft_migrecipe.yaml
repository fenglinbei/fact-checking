extends: liar_raw_llama31_learned_marginal_proxy_fullpool_minmax5_10_lora.yaml

# Llama-3.1-8B FullFT migrecipe variant for LIAR-RAW.
# Applies the same optimized training recipe used on RAWFC (lr 2e-6, 5 epochs,
# plain cosine, weight_decay 0.0, eval_steps 25, ordinal_loss disabled,
# ZeRO-3 bsz2 ga4) to LIAR-RAW 6-way classification.

experiment:
  name: liar_raw__llama31_8b__atom_anchor_v0_2_learned_marginal_proxy_fullpool_minmax5_10_fullft_migrecipe
  case_suffix: __atom_anchor_v0_2_learned_marginal_proxy_fullpool_minmax5_10_fullft_ebs8_lr2em6_ep5_eval25_pat8_migrecipe_liar
  lora_suffix: ""
  run_label: liar-llama31-atom-anchor-v0.2-learned-proxy-fullpool-minmax5-10-fullft-migrecipe
  run_header_label: liar-llama31-atom-anchor-v0.2-learned-proxy-fullpool-minmax5-10-fullft-migrecipe-full

train:
  deepspeed_config: configs/deepspeed/deepspeed_zero3_bsz2_ga4.json
  nproc_per_node: 4

sft_train:
  learning_rate: "2e-6"
  num_train_epochs: 5
  gradient_accumulation_steps: 8
  weight_decay: 0.0
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  eval_steps: 25
  save_steps: 50
  early_stopping_patience: 8
  lr_scheduler_type: cosine
  lr_scheduler_kwargs: null
  lora:
    enabled: false
  label_token_ce:
    early_stopping_metric: macro_f1
    ordinal_loss:
      enabled: false

swanlab:
  project: fact-checking-sentence-trace-method-atom-anchor-v0-2-liar-llama31-fullft
  experiment_name: liar_raw__llama31_8b__atom_anchor_v0_2_learned_marginal_proxy_fullpool_minmax5_10_fullft_migrecipe
