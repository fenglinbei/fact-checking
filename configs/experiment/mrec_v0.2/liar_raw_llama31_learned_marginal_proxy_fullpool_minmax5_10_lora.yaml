extends: learned_marginal_proxy_fullpool_minmax5_10.yaml

# Llama-3.1-8B backbone variant for LIAR-RAW main method (LoRA).
# Same learned marginal proxy selector + minmax(5,10) as Ministral main method,
# only swaps the verifier backbone to Meta-Llama-3.1-8B-Instruct.

experiment:
  name: liar_raw__llama31_8b__atom_anchor_v0_2_learned_marginal_proxy_fullpool_minmax5_10
  base_case_name: liar_raw__llama31_8b
  case_suffix: __atom_anchor_v0_2_learned_marginal_proxy_fullpool_minmax5_10
  lora_suffix: _lora_ebs16_lr2em5_ep12_eval100_pat8_liarw
  run_label: liar-llama31-atom-anchor-v0.2-learned-proxy-fullpool-minmax5-10-lora
  run_header_label: liar-llama31-atom-anchor-v0.2-learned-proxy-fullpool-minmax5-10-lora-full

build:
  prompt:
    model_name_or_path: /data/models/Meta-Llama-3.1-8B-Instruct
    chat_template:
      mode: tokenizer_default
      add_generation_prompt: true
      template_kwargs: {}
      migration_note: llama31_tokenizer_default

train:
  model_name_or_path: /data/models/Meta-Llama-3.1-8B-Instruct
  deepspeed_config: configs/deepspeed/deepspeed_zero2_bsz1_ga4.json
  nproc_per_node: 4

sft_train:
  gradient_accumulation_steps: 4
  learning_rate: "2e-5"
  num_train_epochs: 12
  save_steps: 100
  eval_steps: 100
  early_stopping_patience: 8
  lora:
    r: 16
    alpha: 32
    dropout: 0.10
    bias: none
  label_token_ce:
    early_stopping_metric: macro_f1
    class_weights:
      "pants-fire": 1.2
      "false": 1.0
      "barely-true": 1.5
      "half-true": 1.0
      "mostly-true": 1.0
      "true": 1.8

infer:
  server:
    extra_args: []

swanlab:
  project: fact-checking-sentence-trace-method-atom-anchor-v0-2-liar-llama31
  experiment_name: liar_raw__llama31_8b__atom_anchor_v0_2_learned_marginal_proxy_fullpool_minmax5_10

sentence_trace_method:
  case_name: liar_raw__llama31_8b
  model: llama31_8b
