output_dir: outputs/liar-raw/llm_baseline
wandb:
  enabled: true
  project: fact-checking
  run_name: llm_baseline_b0.2_sft
  entity: null
  log_model: false
  watch: false

data:
  train_candidates: outputs/liar-raw/stage_a/stage_a_train.jsonl
  val_candidates: outputs/liar-raw/stage_a/stage_a_val.jsonl
  test_candidates: outputs/liar-raw/stage_a/stage_a_test.jsonl

baseline:
  variant: b0.2
  model_name_or_path: /data/models/Qwen2.5-7B-Instruct
  top_k: 10
  use_context: false
  context_k: 1
  prompt_mode: zero_shot
  few_shot_k: 16
  few_shot_mmr_lambda: 0.7
  retrieval_model: /data/models/bge-base-en-v1.5/
  retrieval_batch_size: 256
  retrieval_max_length: 256
  max_new_tokens: 128
  temperature: 0.0
  do_sample: false
  prompt_version: v2
  output_mode: explanation_label
  prompt_truncation:
    enabled: true
    strategy: tail_evidence
    min_evidence_to_keep: 1

sft_train:
  deepspeed_config: configs/deepspeed_zero2.json
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-5
  num_train_epochs: 2
  weight_decay: 0.0
  warmup_ratio: 0.03
  bf16: true
  max_length: 1024
  logging_steps: 2
  save_steps: 50
  eval_steps: 50
  dataloader_num_workers: 4
  gradient_checkpointing: true
  use_flash_attention_2: true
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  padding: longest
  use_length_bucket: true
  lora:
    enabled: true
    r: 16
    alpha: 32
    dropout: 0.05
    bias: none
    target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj
    modules_to_save: null
  online_vllm_eval:
    enabled: true
    device: cuda:3
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.95
    dtype: bfloat16
    backend: direct_load
    load_format: dummy
    enforce_eager: true
    sleep_after_eval: false
    use_tqdm: true
    max_num_seqs: 64
  empty_cache_steps: 1
  empty_cache_on_eval: true
  empty_cache_on_save: true
